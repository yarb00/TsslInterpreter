name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to inject into the upload name (if any)
        required: false
        type: string
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  release:

    name: Publish (Release)

    strategy:
      matrix:
        os:
          - runner_name: ubuntu-22.04
            dotnet_rid: linux-x64
          - runner_name: ubuntu-22.04-arm
            dotnet_rid: linux-arm64
          - runner_name: macos-15
            # macOS 15 ARM64 is used to build both osx-arm64 and osx-x64 (universal)
          - runner_name: windows-2022
            dotnet_rid: win-x64

    runs-on: ${{ matrix.os.runner_name }}

    env:
      OUTPUT_PATH_BASE: artifacts/publish/TsslInterpreter/release
      OUTPUT_PATH: artifacts/publish/TsslInterpreter/release_${{ matrix.os.dotnet_rid }}
      UPLOAD_NAME_BASE: TsslInterpreter${{ case(inputs.version != '', '_v', '') }}${{ inputs.version }}
      UPLOAD_NAME: TsslInterpreter${{ case(inputs.version != '', '_v', '') }}${{ inputs.version }}_${{ matrix.os.dotnet_rid }}

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build (Windows/Linux)
        if: runner.os != 'macOS'
        run: dotnet publish -r ${{ matrix.os.dotnet_rid }}

      - name: Build (macOS ARM64)
        if: runner.os == 'macOS'
        run: dotnet publish -r osx-arm64

      - name: Build (macOS x64)
        if: runner.os == 'macOS'
        run: dotnet publish -r osx-x64

      - name: Rename the executable file (Windows)
        if: runner.os == 'Windows'
        run: Rename-Item -Path ${{ env.OUTPUT_PATH }}/TsslInterpreter.exe -NewName tssl.exe
        shell: pwsh

      - name: Rename the executable file (Linux)
        if: runner.os == 'Linux'
        run: mv ${{ env.OUTPUT_PATH }}/TsslInterpreter ${{ env.OUTPUT_PATH }}/tssl

      - name: Create an intermediate directory (macOS)
        if: runner.os == 'macOS'
        run: mkdir artifacts/macos-universal

      - name: Build a universal binary (macOS)
        if: runner.os == 'macOS'
        run: lipo -create -output artifacts/macos-universal/tssl ${{ env.OUTPUT_PATH_BASE }}_osx-arm64/TsslInterpreter ${{ env.OUTPUT_PATH_BASE }}_osx-x64/TsslInterpreter

      - name: Sign the executable file (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - artifacts/macos-universal/tssl

      - name: Copy the license file (macOS)
        if: runner.os == 'macOS'
        run: cp ${{ env.OUTPUT_PATH_BASE }}_osx-arm64/LICENSE.txt artifacts/macos-universal/LICENSE.txt

      - name: Set the output path (macOS)
        if: runner.os == 'macOS'
        run: echo "OUTPUT_PATH=artifacts/macos-universal" >> $GITHUB_ENV

      - name: Set the upload name (macOS)
        if: runner.os == 'macOS'
        run: echo "UPLOAD_NAME=${{ env.UPLOAD_NAME_BASE }}_macos-universal" >> $GITHUB_ENV

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UPLOAD_NAME }}
          path: ${{ env.OUTPUT_PATH }}
          if-no-files-found: error
