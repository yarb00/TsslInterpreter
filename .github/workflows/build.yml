name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  debug:

    name: Build (Debug)

    strategy:
      matrix:
        os:
          - runner_name: ubuntu-latest
          - runner_name: windows-latest

    env:
      # "dotnet_version" is 9.0.x instead of 8.0.x, because SDK 8 doesn't support XML solutions (.slnx)
      dotnet_version: 9.0.x
      upload_path_base: src/bin/Debug/net8.0

    runs-on: ${{ matrix.os.runner_name }}

    steps:

      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.dotnet_version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Debug --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TsslInterpreter ( ${{ matrix.os.runner_name }}, Debug )
          path: ${{ env.upload_path_base }}
          if-no-files-found: error

  release:

    name: Build (Release)

    strategy:
      matrix:
        os:
          - runner_name: ubuntu-latest
            dotnet_rid: linux-x64
          - runner_name: windows-latest
            dotnet_rid: win-x64

    env:
      # "dotnet_version" is 9.0.x instead of 8.0.x, because SDK 8 doesn't support XML solutions (.slnx)
      dotnet_version: 9.0.x
      upload_path_base: src/bin/Release/net8.0

    runs-on: ${{ matrix.os.runner_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.dotnet_version }}

      - name: Build
        run: dotnet publish -c Release -r ${{ matrix.os.dotnet_rid }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TsslInterpreter ( ${{ matrix.os.runner_name }}, Release, ${{ matrix.os.dotnet_rid }} )
          path: ${{ env.upload_path_base }}/${{ matrix.os.dotnet_rid }}/publish
          if-no-files-found: error
